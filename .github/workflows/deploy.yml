name: Search Engine CI

# 1. 언제 실행할까? (Trigger)
# master 브랜치에 코드가 push 되면 실행해라!
on:
  push:
    branches: [ "master" ]

# 2. 무슨 일을 할까? (Jobs)
jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub가 빌려주는 리눅스 컴퓨터 사용
    
    steps:
    # (1) 내 코드 가져오기
    - name: Checkout code
      uses: actions/checkout@v3

    # (2) Docker Hub 로그인 (우리가 저장한 Secret 사용!)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # (2.5) 이미지 보안 스캔 (Trivy)
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '.' # 현재 폴더의 Dockerfile을 기반으로 검사
        format: 'table' # 결과를 표 형식으로 보여줘
        exit-code: '0' # 취약점이 있어도 일단은 에러 내지 말고 진행해 (실습용)
        # exit-code: '1' # (실전용) 취약점 발견되면 빌드 실패시키기
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH' # 심각한 위험만 보여줘

    # (3) Docker 이미지 빌드 & 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true # 빌드 후 DockerHub에 업로드까지 해라
        # 태그 전략: 두 가지를 동시에 만듭니다.
        # 1. latest: 누구나 쉽게 최신 버전을 받을 수 있게 (덮어쓰기용)
        # 2. commit sha: 쿠버네티스가 캐시 없이 확실하게 배포할 수 있게 (고유 식별용)
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/search-engine:latest
          ${{ secrets.DOCKER_USERNAME }}/search-engine:sha-${{ github.sha }}
