name: CI/CD Pipeline

# 1. 언제 실행할까? (Trigger)
# master 브랜치에 코드가 push 되면 실행해라!
on:
  push:
    branches: [ "master" ]

# [중요] 봇이 코드를 수정해서 push 할 수 있게 권한 부여
permissions:
  contents: write 

# 2. 무슨 일을 할까? (Jobs)
jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub가 빌려주는 리눅스 컴퓨터 사용
    
    steps:
    # (1) 내 코드 가져오기
    - name: Checkout code
      uses: actions/checkout@v3

    # (2) Docker Hub 로그인 (우리가 저장한 Secret 사용!)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # (2.5) 이미지 보안 스캔 (Trivy)
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'    # <--- [중요] 이미지가 아니라 '파일 시스템'을 검사해라
        image-ref: '.' # 현재 폴더의 Dockerfile을 기반으로 검사
        format: 'table' # 결과를 표 형식으로 보여줘
        exit-code: '0' # 취약점이 있어도 일단은 에러 내지 말고 진행해 (실습용)
        # exit-code: '1' # (실전용) 취약점 발견되면 빌드 실패시키기
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH' # 심각한 위험만 보여줘

    # (3) Docker 이미지 빌드 & 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true # 빌드 후 DockerHub에 업로드까지 해라
        # 태그 전략: 두 가지를 동시에 만듭니다.
        # 1. latest: 누구나 쉽게 최신 버전을 받을 수 있게 (덮어쓰기용)
        # 2. commit sha: 쿠버네티스가 캐시 없이 확실하게 배포할 수 있게 (고유 식별용)
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/search-engine:latest
          ${{ secrets.DOCKER_USERNAME }}/search-engine:sha-${{ github.sha }}

    # (4) k8s Manifest 자동 업데이트 (CD의 핵심!)
    - name: Update Kubernetes Manifest
      run: |
        # 1. Git 설정 (봇이 수정하는 것처럼 설정)
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

        # 2. k8s/app.yaml 파일의 이미지 태그 부분 수정
        # sed 명령어를 사용해 'search-engine:' 뒤에 오는 태그를 현재 커밋 해시(sha)로 바꿔치기 합니다.
        sed -i "s|${{ secrets.DOCKER_USERNAME }}/search-engine:.*|${{ secrets.DOCKER_USERNAME }}/search-engine:sha-${{ github.sha }}|g" k8s/app.yaml

        # 3. 수정된 내용 확인 (로그 출력용)
        cat k8s/app.yaml | grep image:

        # 4. Git에 변경 사항 반영 (Commit & Push)
        git add k8s/app.yaml
        git commit -m "Update image tag to sha-${{ github.sha }}"
        git push
